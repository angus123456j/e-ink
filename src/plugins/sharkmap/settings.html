<div class="form-group">
    <div class="form-group nowrap">
        <label for="lookbackDays" class="form-label">Lookback Window (days):</label>
        <input type="number" id="lookbackDays" name="lookbackDays" class="form-input"
               min="1" max="90" step="1" value="7">
    </div>
    <div class="form-group nowrap">
        <label for="maxSpots" class="form-label">Max Sightings Plotted:</label>
        <input type="number" id="maxSpots" name="maxSpots" class="form-input"
               min="5" max="200" step="1" value="40">
    </div>
</div>

<div class="form-group">
    <div class="form-group">
        <label for="showStrip" class="form-label">Show Caption Strip:</label>
        <div class="toggle-container">
            <input type="checkbox" id="showStrip" name="showStrip" class="toggle-checkbox" value="true"
                   checked onclick="this.value = this.checked ? 'true' : 'false'">
            <label for="showStrip" class="toggle-label"></label>
        </div>
    </div>
</div>

<div class="form-group">
    <div class="form-group">
        <label for="speciesFilter" class="form-label">Species (optional):</label>
        <input type="text" id="speciesFilter" name="speciesFilter" class="form-input"
               placeholder="e.g. Tiger Shark - leave blank for all sharks">
    </div>
</div>

<div class="form-group">
    <span style="color: var(--text-primary); font-size: 0.85em;">
        Sightings come from iNaturalist and are limited to community-verified
        (research grade) records. This is citizen science data, so it shows where
        people report sharks rather than where sharks are, and iNaturalist
        deliberately obscures locations for threatened species.
    </span>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const showStrip = document.getElementById('showStrip');

        if (loadPluginSettings) {
            document.getElementById('lookbackDays').value = pluginSettings.lookbackDays || 7;
            document.getElementById('maxSpots').value = pluginSettings.maxSpots || 40;
            document.getElementById('speciesFilter').value = pluginSettings.speciesFilter || '';

            // Settings come back as the strings "true"/"false", so compare
            // explicitly -- the string "false" is truthy in JavaScript.
            showStrip.checked = String(pluginSettings.showStrip) !== 'false';
        }

        // Keep the submitted value in step with the checkbox on first paint.
        showStrip.value = showStrip.checked ? 'true' : 'false';
    });
</script>
